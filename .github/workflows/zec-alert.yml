name: ZEC Alert Check

on:
  schedule:
    # Every 15 minutes — sweet spot entre velocidad y limpieza del repo
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Required to commit state file back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install nodemailer

      - name: Run ZEC check
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MIN_PCT: ${{ secrets.MIN_PCT }}
        run: node check-zec.js

      - name: Commit state file if changed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain last-state.json)" ]]; then
            git add last-state.json
            git commit -m "Update divergence state [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "Push failed, will retry next run"
          else
            echo "State unchanged, no commit needed"
          fi
